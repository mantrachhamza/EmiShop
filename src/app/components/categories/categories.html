<div class="container my-4">
  <h3 class="mb-3">Catégories</h3>

  <div class="row g-3">
    <div
      class="col-6 col-md-3"
      *ngFor="let c of categories"
    >
      <div class="category-card shadow-sm">
        <div class="icon">{{ c.icon }}</div>
        <div class="name">{{ c.name }}</div>
      </div>
    </div>
  </div>
</div>
