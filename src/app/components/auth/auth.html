<div class="container mt-5" style="max-width: 400px;">
  <h3 class="text-center mb-3">Connexion</h3>

  <form (ngSubmit)="login()">
    <div class="mb-3">
      <label>Email</label>
      <input
        class="form-control"
        type="email"
        [(ngModel)]="email"
        name="email"
        required
      >
    </div>

    <div class="mb-3">
      <label>Mot de passe</label>
      <input
        class="form-control"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
      >
    </div>

    <button class="btn btn-primary w-100">
      Se connecter
    </button>
  </form>
</div>
